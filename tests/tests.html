<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Budget Lens — Unit Test Suite</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 780px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #f8fafc; }
    h1 { font-size: 1.4rem; margin-bottom: 1rem; }
    .row { padding: 0.65rem 1rem; border-radius: 8px; margin-bottom: 0.5rem; font-family: monospace; }
    .pass { background: rgba(16, 185, 129, 0.18); border-left: 4px solid #10b981; }
    .fail { background: rgba(244, 63, 94, 0.22); border-left: 4px solid #f43f5e; }
  </style>
</head>
<body>
  <h1>Budget Lens — In-Browser Unit Tests</h1>
  <div id="results"></div>

  <script type="module">
    import { toMinorUnits, shiftMonth } from '../js/format.js';
    import { computeMonthlySummary, computeMedian, computeSixMonthSeries } from '../js/analytics.js';
    import { serializeTransactionsCSV, parseTransactionsCSV } from '../js/csv.js';

    const out = document.getElementById('results');

    function assertEqual(actual, expected, msg = '') {
      if (actual !== expected) throw new Error(`${msg} Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
    }

    function test(name, fn) {
      const div = document.createElement('div');
      try {
        fn();
        div.className = 'row pass';
        div.textContent = `✓ PASS: ${name}`;
      } catch (err) {
        div.className = 'row fail';
        div.textContent = `✗ FAIL: ${name} — ${err.message}`;
      }
      out.appendChild(div);
    }

    test('Integer minor units avoid floating-point drift (0.1 + 0.2 === 30 paise)', () => {
      assertEqual(toMinorUnits('0.10') + toMinorUnits('0.20'), 30);
    });

    test('Category totals aggregate accurately within selected month', () => {
      const txs = [
        { id: '1', date: '2026-11-02', type: 'expense', category: 'Food', amount: 25000, note: '' },
        { id: '2', date: '2026-11-05', type: 'expense', category: 'Food', amount: 15000, note: '' },
        { id: '3', date: '2026-11-06', type: 'expense', category: 'Transport', amount: 10000, note: '' }
      ];
      const res = computeMonthlySummary(txs, '2026-11');
      assertEqual(res.byCategory.Food, 40000);
      assertEqual(res.byCategory.Transport, 10000);
      assertEqual(res.totalSpent, 50000);
    });

    test('Month shifting and 6-month grouping cross year boundaries cleanly', () => {
      assertEqual(shiftMonth('2026-01', -1), '2025-12');
      const txs = [
        { id: '1', date: '2025-12-15', type: 'expense', category: 'Food', amount: 50000, note: '' },
        { id: '2', date: '2026-01-10', type: 'income', category: 'Savings', amount: 200000, note: '' }
      ];
      const series = computeSixMonthSeries(txs, '2026-01');
      assertEqual(series[4].month, '2025-12');
      assertEqual(series[4].expense, 50000);
      assertEqual(series[5].income, 200000);
    });

    test('Median computes accurately for both odd and even transaction counts', () => {
      assertEqual(computeMedian([100, 500, 200]), 200);
      assertEqual(computeMedian([100, 200, 400, 500]), 300);
    });

    test('Savings rate handles zero income safely without division by zero', () => {
      const txs = [{ id: '1', date: '2026-10-01', type: 'expense', category: 'Food', amount: 10000, note: '' }];
      const res = computeMonthlySummary(txs, '2026-10');
      assertEqual(res.savingsRate, 0);
    });

    test('Completed past month linear projection equals total actual spend', () => {
      const txs = [{ id: '1', date: '2025-05-12', type: 'expense', category: 'Shopping', amount: 90000, note: '' }];
      const res = computeMonthlySummary(txs, '2025-05');
      assertEqual(res.projectedSpend, 90000);
    });

    test('CSV round-trip preserves commas and quotes inside notes', () => {
      const original = [{ id: 't1', date: '2026-11-10', type: 'expense', category: 'Food', amount: 12345, note: 'Lunch, "special" thali' }];
      const csv = serializeTransactionsCSV(original);
      const parsed = parseTransactionsCSV(csv);
      assertEqual(parsed.errors.length, 0);
      assertEqual(parsed.valid[0].amount, 12345);
      assertEqual(parsed.valid[0].note, 'Lunch, "special" thali');
    });
  </script>
</body>
</html>
